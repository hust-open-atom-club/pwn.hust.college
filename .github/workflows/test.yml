name: Test building and running dojo

on: [push, pull_request]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true 
          tags: ${{ env.IMAGE_NAME }} 
          cache-from: type=gha
          cache-to: type=gha,mode=max

  setup-test-environment:
    name: Setup Test Environment
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    outputs:
      container-ready: ${{ steps.container-check.outputs.ready }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run dojo from pulled image
        run: |
          docker pull ${{ env.IMAGE_NAME }}
          docker run \
            --privileged \
            -d \
            -v ./dojo-test-data:/opt/pwn.college/data:shared \
            -p 2222:22 -p 80:80 -p 443:443 \
            --name dojo-test \
            ${{ env.IMAGE_NAME }}

      - name: Wait for services to build and start
        run: |
          docker exec dojo-test dojo wait

      - name: Wait for services to be ready
        timeout-minutes: 2
        run: |
          docker exec dojo-test dojo compose logs -f &
          log_pid=$!

          until [[ "$(docker exec dojo-test docker inspect --format='{{.State.Health.Status}}' ctfd)" == "healthy" ]]; do
            sleep 1
          done

          kill $log_pid
          echo "ready=true" >> $GITHUB_OUTPUT
        id: container-check

  all-tests:
    name: Run All Tests
    needs: setup-test-environment
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Prepare Firefox
        uses: browser-actions/setup-firefox@latest
        
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-dependency requests selenium pytest-cov pytest-xdist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run API tests with coverage
        run: |
          pytest -vrpP --cov=dojo_plugin --cov-report=xml:./coverage-api.xml ./test -xvs -k "test_unauthenticated or test_create_dojo or test_delete_dojo" || (docker exec dojo-test docker compose logs && false)

      - name: Run dojo management tests with coverage
        run: |
          pytest -vrpP --cov=dojo_plugin --cov-append --cov-report=xml:./coverage-dojo.xml ./test -xvs -k "test_create_import_dojo or test_join_dojo or test_dojo_completion" || (docker exec dojo-test docker compose logs && false)

      - name: Run challenge tests with coverage
        run: |
          export MOZ_HEADLESS=1
          pytest -vrpP --cov=dojo_plugin --cov-append --cov-report=xml:./coverage-challenge.xml ./test -xvs -k "test_start_challenge or test_workspace_challenge" || (docker exec dojo-test docker compose logs && false)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage-api.xml,./coverage-dojo.xml,./coverage-challenge.xml
          flags: all-tests
          fail_ci_if_error: false